<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<title>Studio Square — nova lozinka</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="preconnect" href="https://puyolmpmuafgmdssxada.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Figtree:wght@400;600;700&display=swap">
<style>
  *{box-sizing:border-box}
  html,body{margin:0}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:#f2fbfb;color:#15262a;font-family:'Figtree',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px;padding:32px 26px;border:1px solid #d6e8e8;border-radius:28px;background:#fff;box-shadow:0 10px 30px rgba(8,69,74,.08)}
  .logo{display:block;width:96px;height:96px;margin:0 auto 4px;object-fit:contain}
  h1{margin:0;font-family:'Lora',Georgia,serif;font-size:26px;font-weight:700;text-align:center}
  p{margin:0;font-size:15px;line-height:1.6;color:#3d5a5e;text-align:center}
  label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:#3d5a5e}
  input{width:100%;padding:14px 18px;border:1px solid #c9eded;border-radius:999px;background:#fff;color:#15262a;font-family:inherit;font-size:16px;outline:none}
  input:focus{border-color:#48D1CC;box-shadow:0 0 0 3px rgba(72,209,204,.25)}
  button,.btn{display:block;width:100%;padding:15px 20px;border:0;border-radius:999px;background:#48D1CC;color:#08454a;font-family:inherit;font-size:16px;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
  button:hover,.btn:hover{background:#3cc4bf}
  button:disabled{opacity:.5;cursor:default}
  .msg{font-size:14px;line-height:1.5;text-align:center}
  .err{color:#9a2f1f}
  .ok{color:#0a6b6b;font-weight:600}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="./logo.png" alt="Studio Square">
  <h1>Nova lozinka</h1>

  <div id="checking"><p>Proveravamo link…</p></div>

  <form id="form" hidden>
    <div style="display:flex;flex-direction:column;gap:14px">
      <p>Unesite novu lozinku za Admin panel.</p>
      <label>Nova lozinka
        <input id="pw1" type="password" autocomplete="new-password" minlength="6" required>
      </label>
      <label>Ponovite novu lozinku
        <input id="pw2" type="password" autocomplete="new-password" minlength="6" required>
      </label>
      <div id="formErr" class="msg err" hidden></div>
      <button id="save" type="submit">Sačuvaj lozinku</button>
    </div>
  </form>

  <div id="done" hidden>
    <div style="display:flex;flex-direction:column;gap:16px">
      <p class="ok">Lozinka je promenjena.</p>
      <p>Prijavite se u Admin panel novom lozinkom.</p>
      <a class="btn" href="/admin">Otvori Admin panel</a>
    </div>
  </div>

  <div id="bad" hidden>
    <div style="display:flex;flex-direction:column;gap:16px">
      <p class="err" id="badText">Link za promenu lozinke nije ispravan ili je istekao.</p>
      <p>Zatražite novi mejl za promenu lozinke i otvorite najnoviji link.</p>
    </div>
  </div>
</main>

<script src="./supabase.js"></script>
<script>
/* Password reset for the admin account.

   The Supabase e-mail link lands here carrying a one-time recovery session.
   This page only sets a new password for that account and signs the
   recovery session out again — it never logs anyone into the Admin panel,
   so admin.html keeps asking for the password exactly as before.

   Handles both link styles Supabase can send:
     #access_token=…&type=recovery           (default template)
     ?token_hash=…&type=recovery             (custom template)              */
(function () {
  var CFG = window.SS_SUPABASE || {};
  var URL_ = String(CFG.url || '').replace(/\/+$/, '');
  var KEY = CFG.key || '';
  var token = null;

  function $(id) { return document.getElementById(id); }
  function show(id) {
    ['checking', 'form', 'done', 'bad'].forEach(function (x) { $(x).hidden = x !== id; });
  }
  function bad(text) {
    if (text) $('badText').textContent = text;
    show('bad');
  }
  function params(str) {
    var out = {};
    String(str || '').replace(/^[#?]/, '').split('&').forEach(function (kv) {
      if (!kv) return;
      var i = kv.indexOf('=');
      var k = decodeURIComponent((i < 0 ? kv : kv.slice(0, i)).replace(/\+/g, ' '));
      out[k] = i < 0 ? '' : decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' '));
    });
    return out;
  }
  function readError(res) {
    return res.text().then(function (t) {
      try { var j = JSON.parse(t); return j.msg || j.message || j.error_description || j.error || t; }
      catch (e) { return t || ('HTTP ' + res.status); }
    }, function () { return 'HTTP ' + res.status; });
  }
  function translate(msg) {
    var m = String(msg || '');
    if (/should be different|same.*password/i.test(m)) return 'Nova lozinka mora biti drugačija od stare.';
    if (/at least|too short|weak/i.test(m)) return 'Lozinka je prekratka ili preslaba. Koristite bar 6 znakova.';
    if (/expired|invalid|jwt/i.test(m)) return 'Link je istekao. Zatražite novi mejl za promenu lozinke.';
    return m || 'Promena lozinke nije uspela. Pokušajte ponovo.';
  }

  // Keep the one-time token out of the address bar and browser history.
  function cleanUrl() {
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
  }

  function start() {
    if (!URL_ || !KEY || /UNESITE/.test(KEY)) {
      bad('Sajt nije povezan sa Supabase-om (supabase.js).');
      return;
    }
    var h = params(location.hash);
    var q = params(location.search);

    if (h.error || q.error) {
      cleanUrl();
      bad(/expired/i.test(h.error_code || q.error_code || h.error_description || '')
        ? 'Link za promenu lozinke je istekao.'
        : 'Link za promenu lozinke nije ispravan ili je već iskorišćen.');
      return;
    }

    if (h.access_token) {
      token = h.access_token;
      cleanUrl();
      show('form');
      $('pw1').focus();
      return;
    }

    if (q.token_hash) {
      cleanUrl();
      fetch(URL_ + '/auth/v1/verify', {
        method: 'POST',
        headers: { 'apikey': KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: q.type || 'recovery', token_hash: q.token_hash })
      }).then(function (res) {
        if (!res.ok) return readError(res).then(function (m) { throw new Error(m); });
        return res.json();
      }).then(function (data) {
        token = data.access_token;
        if (!token) throw new Error('invalid');
        show('form');
        $('pw1').focus();
      }).catch(function () { bad(); });
      return;
    }

    bad('Otvorite ovu stranicu preko linka iz mejla za promenu lozinke.');
  }

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    var p1 = $('pw1').value, p2 = $('pw2').value, err = $('formErr');
    err.hidden = true;
    if (p1.length < 6) { err.textContent = 'Lozinka mora imati bar 6 znakova.'; err.hidden = false; return; }
    if (p1 !== p2) { err.textContent = 'Lozinke se ne poklapaju.'; err.hidden = false; return; }

    $('save').disabled = true;
    $('save').textContent = 'Čuvamo…';
    fetch(URL_ + '/auth/v1/user', {
      method: 'PUT',
      headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: p1 })
    }).then(function (res) {
      if (!res.ok) return readError(res).then(function (m) { throw new Error(m); });
      // End the recovery session; the admin signs in on admin.html as usual.
      return fetch(URL_ + '/auth/v1/logout', {
        method: 'POST',
        headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + token }
      }).catch(function () {});
    }).then(function () {
      token = null;
      try { localStorage.removeItem('ss-admin-session'); } catch (x) {}
      show('done');
    }).catch(function (x) {
      err.textContent = translate(x && x.message);
      err.hidden = false;
      $('save').disabled = false;
      $('save').textContent = 'Sačuvaj lozinku';
    });
  });

  start();
})();
</script>
</body>
</html>
